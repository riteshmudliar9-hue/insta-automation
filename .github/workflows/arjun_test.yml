name: 0c - Arjun test prompt (never posts)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "send or collect"
        default: "send"
permissions:
  contents: write
concurrency:
  group: insta-bot
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python src/main.py arjun-test-${{ github.event.inputs.action }}
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A output data
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: ${{ github.workflow }} $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
