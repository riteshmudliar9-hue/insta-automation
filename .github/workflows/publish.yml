name: 2 - Publish due posts (every 30 min)
on:
  schedule:
    - cron: "0,30 2-17 * * *"   # 07:30-23:00 IST (late slots + Arjun grace period)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: insta-bot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter) >/dev/null 2>&1 || echo "fonts-inter not available; using Poppins"
          pip install -q -r requirements.txt
      - run: python src/main.py publish-due
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A output data
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: ${{ github.workflow }} $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Tell me on Telegram if this failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Workflow \"${{ github.workflow }}\" FAILED. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
